<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3a8bd"/>
      <stop offset="1" stop-color="#6e7390"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0d3e0"/>
      <stop offset="0.5" stop-color="#a3a8bd" stop-opacity="0"/>
      <stop offset="1" stop-color="#555a75"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="-2" dy="-2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="20" y="25" width="216" height="206" rx="22" fill="url(#bg)"/>
    <rect x="21" y="26" width="214" height="204" rx="21" fill="none" stroke="url(#rim)" stroke-width="2"/>
  </g>
  <rect x="58" y="70" width="100" height="74" rx="6" fill="#fcfcff" fill-opacity="0.6"/>
  <rect x="98" y="112" width="100" height="74" rx="6" fill="#fcfcff" filter="url(#lift)"/>
</svg>
